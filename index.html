<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <title>OBMC Enroll Now</title>
</head>
<body>
  <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
  <div class="container-fluid">
    <a class="navbar-brand logo-circle me-3" href="#">
     <img src="https://files.orangeapps.ph/disk001/School_Files/1/school-65/school_profile/1789004299-2727.png"" alt="Logo" width="91">
    </a>
    <h2 style="color: white;"          class="fw-normal mb-3">OB Montessori</h2>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="collapsibleNavbar">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link" href="#">Enroll Now</a>
        </li>
      </ul>
      <form class="d-flex ms-auto">
        <input class="form-control me-2" type="text" placeholder="Search here...">
        <button class="btn btn-primary" type="button">Search</button>
      </form>
    </div>
  </div>

<h2 style="color: white; text-align: center;" class="fw-normal mb-3">OBMC Student Enrollment Form</h2>
<br>
<h4 style="color: white; text-align: center">Fill out the form below to enroll for the upcoming school year!</h4>

<section class="portfolio-section">
        <div class="contact-card">
            <form action="submit" method="POST">
                <div class="form-group">
                    <label for="name">First Name:</label>
                    <input type="text" id="name" name="name" placeholder="Juan" required>
                </div>

                <div class="form-group">
                    <label for="name">Last Name:</label>
                    <input type="text" id="name" name="name" placeholder=" Dela Cruz" required>
                </div>


                <div class="form-group">
                    <label for="event-date">Select your birthday here:</label>
                    <input type="date" id="date" name="date" class="styled-date"
                </div>

                <h5>Gender</h5>
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Rather not say">Rather not say</option>
                    </select>
                </div>  
                
                <h5>Grade Level</h5>
                <div class="form-group">
                    <label for="grade-level">Your Grade Level</label>
                    <select id="Grade" name="Grade">
                        <option value="Casa">Casa</option>
                        <option value="primary">Primary Grade School</option>
                        <option value="Intermediate Grade School">Intermediate Grade School</option>
                        <option value="JHS">Junior High School</option>
                        <option value="SHS">Senior High School</option>
                    </select>
                </div> 
                <h2>Contact Details:</h2>
                  <h5>Email</h5>
                  <div class="form-group">
                    <label for="email">Your Email here:</label>
                    <input type="email" id="email" name="email" placeholder="example@obmontessori.edu.ph" required>
                </div>

                <h5>Contact Number</h5>
                <div class="form-group">
                    <label for="contact">Contacts:</label>
                    <input type="contacts" id="contacts" name="contacts" placeholder="1234 5678" required>
                </div>

                <h5>Other Information:</h5>
                
                <h6>Mode of Learning:</h6>
                <input type="radio" id="html" name="fav_language" value="Online">
                <label for="online">Online</label><br>
                <input type="radio" id="Face to Face" name="face to face" value="Face to Face">
                <label for="face to face">Face to Face</label><br>

                <input type="checkbox" id="checkbox" name="checkbox" value="checkbox">
                <label for="checkbox">I confirm that the info I provided is honest and sincere</label>

                <div class="form-group">
                  <button class="btn btn-primary" type="submit" class="submit-btn">Enroll Now!</button>
                 </div>
                </section>

</body>
<footer>

</footer>
</html>
